
name: Build PromptForge Android APK

on:
  push:
    branches: [main]
    paths:
      - 'PromptForge-Android-Complete.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract original project
        shell: bash
        run: |
          set -euo pipefail
          test -f PromptForge-Android-Complete.zip
          mkdir -p /tmp/promptforge-source
          unzip -q PromptForge-Android-Complete.zip -d /tmp/promptforge-source

          APP_BUILD_FILE="$(find /tmp/promptforge-source -type f -path '*/app/build.gradle' -print -quit)"

          if [ -z "$APP_BUILD_FILE" ]; then
            echo "Could not find app/build.gradle in the ZIP."
            find /tmp/promptforge-source -maxdepth 5 -type f | head -100
            exit 1
          fi

          APP_DIR="$(dirname "$APP_BUILD_FILE")"
          rm -rf app
          cp -a "$APP_DIR" ./app

          test -f app/src/main/AndroidManifest.xml
          test -f settings.gradle
          test -f build.gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptForge-Android-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
