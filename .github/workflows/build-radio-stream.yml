
name: Build Godot Online Radio (Android ARM64)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-radio-stream.yml"

permissions:
  contents: read

jobs:
  build-android-radio:
    name: Compile IceCast radio extension for Android
    runs-on: ubuntu-22.04

    steps:
      - name: Check out radio extension source
        uses: actions/checkout@v4
        with:
          repository: Azumist/icy-radio-streamer
          ref: main
          submodules: recursive
          path: radio-source
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK r23c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons
          scons --version

      - name: Compile Android ARM64 release library
        working-directory: radio-source
        run: |
          scons target=template_release platform=android arch=arm64v8 -j2
          ls -lah project/addons/icy-radio-streamer/bin/

      - name: Package Godot addon
        run: |
          mkdir -p radio-artifact
          cp -R radio-source/project/addons/icy-radio-streamer radio-artifact/
          cp radio-source/README.md radio-artifact/README-upstream.md
          cp radio-source/LICENSE.md radio-artifact/LICENSE-upstream.md
          cd radio-artifact
          zip -r ../icy-radio-streamer-android-arm64.zip .

      - name: Upload Android radio extension
        uses: actions/upload-artifact@v4
        with:
          name: icy-radio-streamer-android-arm64
          path: icy-radio-streamer-android-arm64.zip
          if-no-files-found: error
          retention-days: 14
